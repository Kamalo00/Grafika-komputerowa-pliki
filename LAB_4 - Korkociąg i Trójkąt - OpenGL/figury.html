<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Zadanie_OpenGL1</title>
    <script src="ruch.js"></script> 
    <script>

        let rotateX = 15; 
        let rotateY = -15;
        let rotateZ = 0;
        var objectNumber = 1;


        function Poly(r, g, b, n, rb) {
            glColor3f(r, g, b);
            glBegin(GL_TRIANGLE_FAN);
            var degree = 0;
            var move = Math.PI * 2 / n;
            for (let i = 0; i < n; i++) {
                var x = r * Math.cos(degree);
                var y = r * Math.sin(degree);
                degree += move;
                glVertex3f(x, y, 0);
            }
            glEnd();
        }

        function Triangle(r, g, b, Points) {
            glColor3f(r, g, b);
            glBegin(GL_TRIANGLE_FAN);
            glVertex3f(Points[0][0], Points[0][1], Points[0][2]);
            glVertex3f(Points[1][0], Points[1][1], Points[1][2]);
            glVertex3f(Points[2][0], Points[2][1], Points[2][2]);
            glEnd();
        }

        function Triangle1Side(r, g, b, n, rb, h) {
            var degree = 0;
            var move = Math.PI * 2 / n;

            for (let i = 0; i < n; i++) {
                var x = rb * Math.cos(degree);
                var y = rb * Math.sin(degree);
                const Points = [[x, y, 0]];
                degree += move;
                x = rb * Math.cos(degree);
                y = rb * Math.sin(degree);
                Points.push([x, y, 0]);
                Points.push([0, 0, h]);
                Triangle(r + i / n, g + i / (2 * n), b + i / (3 * n), Points);
            }
        }

        function Pyramida(scale, n, rb, h) {
        glPushMatrix();
        glScalef(scale, scale, scale);
        Poly(0.3, 0.7, 0.5, n, rb);              
        Triangle1Side(0.6, 0.6, 0.1, n, rb, h);  
        glPopMatrix();
        }    

        function Korkociag(scale, n, r, h) {
            glPushMatrix();
            glScalef(scale, scale, scale);
            //glColor3f(0.5, 0.3, 0.7);
            var radius = 0;
            var stepR = r / (360 * n);
            var stepH = h / (360 * n);
            var totalSteps = 360 *n;
    
            for (var degree = 0; degree < totalSteps - 1; degree += 1) {

            var t = degree / totalSteps;
            var red   = t * 0.6;         
            var green = 1.0 - t * 0.5;    
            var blue  = t;                 
            glColor3f(red, green, blue);

            glBegin(GL_LINES);
            radius = stepR * degree;
            var x1 = Math.cos(degree * Math.PI / 180) * radius;
            var y1 = Math.sin(degree * Math.PI / 180) * radius;
            var z1 = stepH * degree;

            radius = stepR * (degree + 1);
            var x2 = Math.cos((degree + 1) * Math.PI / 180) * radius;
            var y2 = Math.sin((degree + 1) * Math.PI / 180) * radius;
            var z2 = stepH * (degree + 1);

            glVertex3f(x1, y1, z1);
            glVertex3f(x2, y2, z2);
            glEnd();
             }
             glPopMatrix();
        }

        function display() {

            glClear(GL_COLOR_BUFFER_BIT | GL_DEPTH_BUFFER_BIT);

            glLoadIdentity();
            glRotatef(rotateZ, 0, 0, 1);
            glRotatef(rotateY, 0, 1, 0);
            glRotatef(rotateX, 1, 0, 0);
            switch (objectNumber) {
                case 1:
                    Korkociag(1, 11, 0.5, 0.8);
                    break;
                case 2:
                    Pyramida(1, 11, 0.3, 1);
                    break;
                default:
                    break;
            }

        }

        function initGL() {
            glMatrixMode(GL_PROJECTION);
            glOrtho(-1, 1, -1, 1, -1, 1);
            glMatrixMode(GL_MODELVIEW);
            glEnable(GL_DEPTH_TEST);
            glClearColor(0, 0, 0, 1);
        }

        function doKeyDown(evt) {
            let key = evt.keyCode;
            if (key == 37) 
                rotateY -= 15;
            else if (key == 39) 
                rotateY += 15;
            else if (key == 40) 
                rotateX += 15;
            else if (key == 38) 
                rotateX -= 15;
            else if (key == 33) 
                rotateZ += 15;
            else if (key == 34) 
                rotateZ -= 15;
            else if (key == 36) 
                rotateX = rotateY = rotateZ = 0;
            if (key >= 34 && key <= 40) {
                evt.preventDefault();
            }
            if (key == 49)
                objectNumber = 1
            else if (key == 50)
                objectNumber = 2
            display();
        }

        function init() {
            try {
                glsimUse("glcanvas"); 
            } catch (e) {
                document.getElementById("canvas-holder").innerHTML =
                    "Wystąpił błąd:<br>" + e;
                return;
            }
            document.onkeydown = doKeyDown;
            initGL();
            display();
        }

    </script>
</head>

<body onload="init()">

    <h3>Zadanie_OpenGL1</h3>

    <p>Używaj strzałek do poruszania figurą</p>

    <noscript>
        <p><b>Potrzebujesz skrypt JavaScript!</b></p>
    </noscript>

    <div id="canvas-holder">
        <canvas id="glcanvas" width="500" height="500"></canvas>
    </div>

</body>

</html>
