<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Three.js Lab 10 - Hetman</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; overflow: hidden; background: #1a1a1a; }
  canvas { display: block; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

let scene, camera, renderer, controls;

function init() {
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(window.devicePixelRatio);
  document.body.appendChild(renderer.domElement);

  camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.set(14, 10, 14);

  controls = new OrbitControls(camera, renderer.domElement);
  controls.target.set(0, 4, 0);
  controls.update();

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  scene = buildHetman();
  animate();
}

function setupLights(s) {
  const ambient = new THREE.AmbientLight(0xffffff, 0.6);
  s.add(ambient);
  const direct = new THREE.DirectionalLight(0xffffff, 1.0);
  direct.position.set(10, 20, 10);
  s.add(direct);
}
function buildHetman() {
  const s = new THREE.Scene();
  s.background = new THREE.Color(0x1a1a1a); 
  setupLights(s);

  const points = [
  // Podstawa Pionka
  new THREE.Vector2(0.00, 0.00),
  new THREE.Vector2(1.40, 0.00),
  new THREE.Vector2(1.50, 0.15),
  new THREE.Vector2(1.45, 0.35),
  new THREE.Vector2(1.20, 0.55),
  new THREE.Vector2(0.90, 0.75),

  // Trzon Pionka
  new THREE.Vector2(0.65, 1.20),
  new THREE.Vector2(0.60, 1.60),
  new THREE.Vector2(0.65, 2.00),

  // Kołnierz Pionka
  new THREE.Vector2(0.55, 2.30),
  new THREE.Vector2(0.58, 2.50),
  new THREE.Vector2(1.30, 2.70),  
  new THREE.Vector2(1.35, 2.80),
  new THREE.Vector2(0.90, 2.95),
  new THREE.Vector2(0.70, 3.10),

  // Głowa Pionka
  new THREE.Vector2(0.65, 3.25),
  new THREE.Vector2(0.85, 3.55),
  new THREE.Vector2(0.90, 3.75),
  new THREE.Vector2(0.75, 4.00),
  new THREE.Vector2(0.50, 4.20),
  new THREE.Vector2(0.45, 4.35),
  new THREE.Vector2(0.30, 4.55),
  new THREE.Vector2(0.10, 4.65),
  new THREE.Vector2(0.00, 4.65),
];

  const geom = new THREE.LatheGeometry(points, 64);
  geom.computeVertexNormals();

  const material = new THREE.MeshStandardMaterial({
    color: 0xffffff,       
    metalness: 0.1,        
    roughness: 1.5,       
    side: THREE.DoubleSide
  });

  const mesh = new THREE.Mesh(geom, material);
  s.add(mesh);

  const grid = new THREE.GridHelper(10, 10);
  s.add(grid);

  return s;
}
function animate() {
  requestAnimationFrame(animate);
  renderer.render(scene, camera);
}

init();
</script>
</body>
</html>
