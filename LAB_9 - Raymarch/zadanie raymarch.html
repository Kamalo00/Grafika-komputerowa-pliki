<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zadanie Raymarching</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; }
        canvas { display: block; }
        #ui { position: absolute; top: 15px; left: 15px; z-index: 10; display: flex; gap: 10px; }
        button { padding: 10px 15px; cursor: pointer; background: #333; color: #fff; border: 1px solid #555; border-radius: 4px; }
        button:hover { background: #555; }
    </style>
</head>
<body>
    <div id="ui">
        <button id="btn-add">Suma (min)</button>
        <button id="btn-intersect">Przecięcie (max)</button>
        <button id="btn-diff">Różnica (max(a, -b))</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <script>
     
        const renderer = new THREE.WebGLRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const scene = new THREE.Scene();
        
        const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        camera.position.z = 0.5;

        const geometry = new THREE.PlaneGeometry(2, 2);

        const uniforms = {
            u_resolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
            u_time: { value: 0.0 },
            u_operation: { value: 0.0 } 
        };

        document.getElementById('btn-add').onclick = () => uniforms.u_operation.value = 0.0;
        document.getElementById('btn-intersect').onclick = () => uniforms.u_operation.value = 1.0;
        document.getElementById('btn-diff').onclick = () => uniforms.u_operation.value = 2.0;

        const material = new THREE.ShaderMaterial({
            uniforms: uniforms,
            vertexShader: `
                void main() {
                    gl_Position = vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform vec2 u_resolution;
                uniform float u_time;
                uniform float u_operation; 

                #define MAX_STEPS 100
                #define MAX_DIST 100.0
                #define SURF_DIST 0.001

            
                float sdSphere(vec3 p, float r) {
                    return length(p) - r;
                }

                float sdBox(vec3 p, vec3 b) {
                    vec3 q = abs(p) - b;
                    return length(max(q, vec3(0.0))) + min(max(q.x, max(q.y, q.z)), 0.0);
                }
                mat2 rot(float a) {
                    float s = sin(a), c = cos(a);
                    return mat2(c, -s, s, c);
                }

             
                vec2 scene(vec3 p) {
                    vec3 spherePos = p - vec3(sin(u_time) * 1.2, cos(u_time) * 0.5, 0.0);
                    float d1 = sdSphere(spherePos, 1.0);
                    vec3 boxPos = p;
                    boxPos.xy *= rot(u_time * 0.8);
                    boxPos.xz *= rot(u_time * 0.5);
                    float d2 = sdBox(boxPos, vec3(0.8));

                    float d;
                    
                    if (u_operation < 0.5) {
                        d = min(d1, d2); 
                    } else if (u_operation < 1.5) {
                        d = max(d1, d2); 
                    } else {
                        d = max(d1, -d2); 
                    }

                    return vec2(d, 1.0); 
                }

        
                vec2 rayMarch(vec3 ro, vec3 rd) {
                    float d = 0.0;
                    float id = -1.0;
                    for(int i = 0; i < MAX_STEPS; i++) {
                        vec3 p = ro + rd * d;
                        vec2 hit = scene(p);
                        if (hit.x < SURF_DIST) { id = hit.y; break; }
                        if (d > MAX_DIST) break;
                        d += hit.x;
                    }
                    return vec2(d, id);
                }

              
                vec3 calcNormal(vec3 p) {
                    vec2 e = vec2(0.001, 0.0);
                    return normalize(vec3(
                        scene(p + e.xyy).x - scene(p - e.xyy).x,
                        scene(p + e.yxy).x - scene(p - e.yxy).x,
                        scene(p + e.yyx).x - scene(p - e.yyx).x 
                    ));
                }

                void main() {
                    vec2 uv = (gl_FragCoord.xy - 0.5 * u_resolution.xy) / u_resolution.y;
                    
                    vec3 ro = vec3(0.0, 0.0, 8.0); 
                    vec3 rd = normalize(vec3(uv, -1.5));

                    vec2 hit = rayMarch(ro, rd);
                    float d = hit.x;

                    vec3 col = vec3(0.1, 0.1, 0.15); 

                    if (d < MAX_DIST) {
                        vec3 p = ro + rd * d;
                        vec3 n = calcNormal(p);

                        vec3 lightPos = vec3(2.0, 5.0, 5.0);
                        vec3 lightDir = normalize(lightPos - p);
                        vec3 viewDir = normalize(ro - p);
                        vec3 halfDir = normalize(lightDir + viewDir);
                        
                        float diff = max(dot(n, lightDir), 0.0);
                        float spec = pow(max(dot(n, halfDir), 0.0), 48.0);
                        float amb = 0.08;

                        vec3 baseCol = vec3(0.0, 1.0, 0.0);
                        col = baseCol * (amb + diff * 0.9) + vec3(1.0) * spec * 0.6;
                    }

                    col = pow(col, vec3(0.4545));
                    gl_FragColor = vec4(col, 1.0);
                }
            `
        });

        const mesh = new THREE.Mesh(geometry, material);
        scene.add(mesh);

        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            uniforms.u_time.value = clock.getElapsedTime(); 
            uniforms.u_resolution.value.set(window.innerWidth, window.innerHeight);
            
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
